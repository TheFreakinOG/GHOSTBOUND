name: Bug report
description: Report a reproducible bug in GHOSTBOUND v0.1
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Use only synthetic repositories, credentials, and paths in public reports.
        Security vulnerabilities must be reported according to SECURITY.md, not through a public issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? Please keep the report focused on one reproducible problem.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GHOSTBOUND version or commit
      placeholder: "0.1.0 or full commit SHA"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Windows 11 24H2 or Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "node --version"
    validations:
      required: true

  - type: input
    id: git
    attributes:
      label: Git version
      placeholder: "git --version"
    validations:
      required: true

  - type: input
    id: gitleaks
    attributes:
      label: Gitleaks version
      placeholder: "gitleaks version"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Affected command
      options:
        - plan
        - materialize
        - verify
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect GHOSTBOUND to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Sanitize logs and paths before pasting them.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Provide the smallest reproduction using only a synthetic repository, synthetic credentials, and non-sensitive paths.
      placeholder: |
        1. Create a minimal synthetic Git repository...
        2. Use this synthetic policy...
        3. Run ghostbound ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional sanitized information
      description: Optional context, sanitized logs, or other non-sensitive details.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I confirm this report contains no real credentials, private repository contents, or sensitive local filesystem paths.
          required: true
        - label: I confirm this is not a security vulnerability. Security vulnerabilities must be reported according to SECURITY.md and not in a public issue.
          required: true
