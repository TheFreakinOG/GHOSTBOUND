name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GHOSTBOUND_REQUIRE_GITLEAKS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install verified Gitleaks CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/ghostbound-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$tool_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tool_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Install verified Gitleaks CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'ghostbound-gitleaks'
          New-Item -ItemType Directory -Path $toolDir | Out-Null
          $archive = Join-Path $toolDir 'gitleaks.zip'
          Invoke-WebRequest https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLower() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $toolDir
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Package inventory and CLI smoke test
        shell: bash
        run: |
          npm pack --json > "$RUNNER_TEMP/ghostbound-pack.json"
          node scripts/package-check.mjs "$RUNNER_TEMP/ghostbound-pack.json"
